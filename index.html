<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>xie-bro</title>
    <style>
      #scene-preview {position:fixed;inset:0;overflow:hidden;pointer-events:none;background:#e8e8df}
      #scene-preview .dots,#scene-preview img,#scene-preview .previous-preview {position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
      .dot-colour {position:absolute;left:0;top:0;width:clamp(150px,24vmin,260px);height:auto;opacity:0;
        filter:saturate(1.18);mask-image:radial-gradient(circle closest-side,#000 40%,transparent 100%);transition:opacity .32s ease-out}
      .dot-colour.revealed {opacity:1}
      #scene-preview img {opacity:0;transition:opacity .65s ease-in-out}
      #scene-preview img.decoded {opacity:1}
      @media (prefers-reduced-motion:reduce) {#scene-preview img,.dot-colour {transition:none}}
      @media print {#scene-preview {display:none}}
    </style>
  </head>
  <body>
    <script>
      let savedTheme
      try { savedTheme = localStorage.getItem('theme') } catch {}
      document.body.classList.toggle('dark', savedTheme ? savedTheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches)
    </script>
    <div id="scene-preview" aria-hidden="true"><canvas class="dots"></canvas><canvas class="dot-colour" width="320" height="320"></canvas><img alt="" /></div>
    <div id="app"></div>
    <script>
      /* inline-scene-preview */
      startScenePreview(document.getElementById('scene-preview'), /* winter-samples */{}, '%BASE_URL%')
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
